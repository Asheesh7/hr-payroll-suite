<!DOCTYPE html>
<html>
<head><title>Delete Leave Request</title></head>
<body>
  <h1>Delete Leave Request</h1>
  <p>Are you sure you want to delete this request for {{ leave.employee }}
     ({{ leave.start_date }} to {{ leave.end_date }})?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'leave_request_list' %}">Cancel</a>
  </form>
</body>
</html>
