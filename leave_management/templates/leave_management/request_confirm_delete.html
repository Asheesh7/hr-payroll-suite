{% extends 'employees/base.html' %}
{% block content %}
<div class="card">
    <h1>Delete Leave Request</h1>
    <p>Are you sure you want to delete this request for
       <strong>{{ leave.employee }}</strong>
       ({{ leave.start_date }} to {{ leave.end_date }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'leave_request_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
