<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HR Payroll Suite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #1B3A5C; min-height: 100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { width: 400px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="card login-card shadow-lg p-4">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-primary">HR Payroll Suite</h3>
      <p class="text-muted small">ICT712 Group 5 — VIT Melbourne</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      {% if form.errors %}
      <div class="alert alert-danger py-2 small">Invalid username or password.</div>
      {% endif %}
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
    </form>
  </div>
</body>
</html>
