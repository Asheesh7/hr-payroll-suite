{% extends 'base.html' %}
{% block title %}Create Review{% endblock %}
{% block page_title %}Create Review{% endblock %}

{% block content %}

<div class="card">

  <div class="card-header-custom">
    <i class="bi bi-pen me-2 text-primary"></i>
    Create Performance Review
  </div>

  <div class="card-body">

    <form method="POST">

      {% csrf_token %}

      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label">Employee</label>

          <select name="employee" class="form-select" required>

            {% for emp in employees %}
            <option value="{{ emp.id }}">{{ emp }}</option>
            {% endfor %}

          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Rating</label>

          <input type="number"
                 name="rating"
                 class="form-control"
                 min="1"
                 max="5"
                 required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Comments</label>

          <input type="text"
                 name="comments"
                 class="form-control"
                 required>
        </div>

      </div>

      <div class="mt-3 text-end">

        <button type="submit" class="btn btn-primary">
          Submit Review
        </button>

      </div>

    </form>

  </div>

</div>

{% endblock %}
