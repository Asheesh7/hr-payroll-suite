{% extends 'employees/base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card">
        <h2 style="text-align:center; margin-bottom: 30px;">HR Payroll Suite</h2>
        <h3 style="text-align:center; color:#666; margin-bottom: 25px;">Sign In</h3>
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding: 10px; font-size: 16px;">
                Login
            </button>
        </form>
    </div>
</div>
{% endblock %}
