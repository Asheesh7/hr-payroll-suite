{% extends 'employees/base.html' %}
{% block content %}
<div class="card" style="max-width:500px; margin:auto;">
    <h1>Deactivate Employee</h1>
    <p>Are you sure you want to deactivate <strong>{{ employee.first_name }} {{ employee.last_name }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Deactivate</button>
        <a href="/employees/" class="btn btn-secondary" style="margin-left:10px;">Cancel</a>
    </form>
</div>
{% endblock %}
