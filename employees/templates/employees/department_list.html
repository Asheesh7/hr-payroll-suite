{% extends 'employees/base.html' %}
{% block content %}
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>Departments</h1>
        <a href="/employees/departments/create/" class="btn btn-primary">+ Add Department</a>
    </div>
    <table>
        <thead><tr><th>Department Name</th><th>Actions</th></tr></thead>
        <tbody>
            {% for dept in departments %}
            <tr>
                <td>{{ dept.department_name }}</td>
                <td><a href="/employees/departments/{{ dept.pk }}/edit/" class="btn btn-primary">Edit</a> <a href="/employees/departments/{{ dept.pk }}/delete/" class="btn btn-danger">Delete</a></td>
            </tr>
            {% empty %}
            <tr><td colspan="2">No departments found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
